name: Validate KOMSI Music Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify Supabase SDK is pinned
        run: |
          grep -q '@supabase/supabase-js@2.119.0' index.html
          grep -q '@supabase/supabase-js@2.119.0' auth/confirm/index.html
